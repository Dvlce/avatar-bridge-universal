name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versione da pubblicare (es. v0.7.0)'
        required: true
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Package
        shell: pwsh
        run: ./build-release.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid version tag' }
          [xml]$project = Get-Content src/AvatarBridge.csproj
          if ('v' + $project.Project.PropertyGroup.Version -ne $env:RELEASE_TAG) { throw 'Tag and app version must match' }
          gh release create $env:RELEASE_TAG dist/AvatarBridge-win-x64.zip dist/AvatarBridge-win-x64.zip.sha256 --target $env:GITHUB_SHA --title "Avatar Bridge $env:RELEASE_TAG" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release failed' }
